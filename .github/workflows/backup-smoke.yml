name: backup-smoke
on:
  workflow_dispatch:
    inputs:
      digest:
        description: Packet SHA-256 printed by cloud-run.mjs --dry-run
        required: true
permissions:
  contents: write
concurrency: backup-smoke
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: One-shot review of the synthetic fixture
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ inputs.digest }}
        run: node cloud-run.mjs --run-once "$DIGEST"
